<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>녹음기 · Kongbu</title><link rel="stylesheet" href="../style.css?v=5"><script src="../icons.js?v=5"></script></head>
<body>
<header class="top"><div class="in"><a class="brand" href="../"><span data-icon="logo"></span>Kongbu</a><a class="home" href="../"><span data-icon="back"></span>모든 도구</a></div></header>
<main>
<div class="ttl"><span class="tile" style="--c:#ef4b57" data-icon="mic"></span><div><h1>녹음기</h1><p class="desc">마이크로 녹음하고 바로 다운로드. 서버로 전송되지 않아요.</p></div></div>
<div class="card center">
  <div id="status">대기 중</div>
  <div class="big" id="time">00:00</div>
  <canvas id="meter" width="400" height="60" style="width:100%;height:60px;background:#12141a;border-radius:8px"></canvas>
  <div class="row" style="justify-content:center;margin-top:16px">
    <button id="rec" class="red"><span data-icon="rec"></span>녹음 시작</button>
    <button id="pause" disabled>일시정지</button>
  </div>
  <div class="msg" id="msg"></div>
</div>
<div id="list"></div>
</main>
<script>
const $=id=>document.getElementById(id);
const recBtn=$('rec'),pauseBtn=$('pause'),timeEl=$('time'),statusEl=$('status'),msg=$('msg'),list=$('list');
const canvas=$('meter'),c2=canvas.getContext('2d');
let rec,stream,chunks=[],t0=0,acc=0,timer,actx,analyser,raf,count=0;
const pickMime=()=>['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m))||'';
const fmt=s=>{s=Math.floor(s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const elapsed=()=>acc+(rec&&rec.state==='recording'?(Date.now()-t0)/1000:0);
async function start(){
  msg.textContent='';
  try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}
  catch(e){msg.textContent='마이크 권한이 필요해요. (https 또는 localhost에서 열어주세요)';return}
  const mime=pickMime();
  rec=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);
  chunks=[];acc=0;
  rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  rec.onstop=finish;rec.start(1000);t0=Date.now();
  timer=setInterval(()=>timeEl.textContent=fmt(elapsed()),200);
  meter();
  recBtn.innerHTML=I('stop')+'정지';pauseBtn.disabled=false;statusEl.innerHTML='<span class="dot"></span>녹음 중';
}
function stop(){
  acc=elapsed();rec.stop();stream.getTracks().forEach(t=>t.stop());
  clearInterval(timer);cancelAnimationFrame(raf);actx&&actx.close();
  recBtn.innerHTML=I('rec')+'녹음 시작';pauseBtn.disabled=true;pauseBtn.textContent='일시정지';statusEl.textContent='대기 중';
}
function togglePause(){
  if(rec.state==='recording'){acc=elapsed();rec.pause();pauseBtn.textContent='계속';statusEl.textContent='일시정지됨'}
  else if(rec.state==='paused'){rec.resume();t0=Date.now();pauseBtn.textContent='일시정지';statusEl.innerHTML='<span class="dot"></span>녹음 중'}
}
function finish(){
  const type=rec.mimeType||'audio/webm';
  const blob=new Blob(chunks,{type}),url=URL.createObjectURL(blob);
  const ext=type.includes('mp4')?'m4a':type.includes('ogg')?'ogg':'webm';
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  const name=`녹음_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.${ext}`;
  const div=document.createElement('div');div.className='card';
  div.innerHTML=`<div class="item" style="border:0"><span>#${++count} · ${fmt(acc)} · ${(blob.size/1024).toFixed(0)}KB</span><a class="btn primary" href="${url}" download="${name}">${I('download')} 다운로드</a></div><audio controls src="${url}"></audio>`;
  list.prepend(div);timeEl.textContent='00:00';
}
function meter(){
  actx=new(window.AudioContext||window.webkitAudioContext)();
  const src=actx.createMediaStreamSource(stream);analyser=actx.createAnalyser();analyser.fftSize=256;src.connect(analyser);
  const data=new Uint8Array(analyser.frequencyBinCount);
  (function draw(){raf=requestAnimationFrame(draw);analyser.getByteFrequencyData(data);
    c2.clearRect(0,0,canvas.width,canvas.height);const w=canvas.width/data.length;c2.fillStyle='#e5484d';
    data.forEach((v,i)=>{const h=v/255*canvas.height;c2.fillRect(i*w,canvas.height-h,w-1,h)})})();
}
recBtn.onclick=()=>rec&&rec.state!=='inactive'?stop():start();
pauseBtn.onclick=togglePause;
</script></body></html>
