<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>배경 제거 · Kongbu</title><link rel="stylesheet" href="../style.css">
<style>
  .checker{background:conic-gradient(#2a2e38 25%,#1f222a 0 50%,#2a2e38 0 75%,#1f222a 0) 0 0/20px 20px;border-radius:10px;display:inline-block;max-width:100%}
  .checker img,.checker canvas{display:block;max-width:100%;border-radius:10px}
  .bar{height:8px;background:#12141a;border-radius:99px;overflow:hidden;margin-top:10px}
  .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
</style></head>
<body><main>
<a class="back" href="../">← Kongbu</a>
<h1>✂️ 배경 제거</h1>
<p class="desc">AI가 사진의 배경을 지워서 투명 PNG로 만들어요. 사진은 내 브라우저 안에서만 처리돼요. 처음 한 번은 AI 모델(수십 MB)을 내려받느라 시간이 걸려요.</p>
<div class="card">
  <input type="file" id="file" accept="image/*">
  <div class="row" style="margin-top:12px">
    <div><label>배경 채우기</label>
      <select id="bgmode"><option value="none">투명 (PNG)</option><option value="#ffffff">흰색</option><option value="#000000">검정</option><option value="custom">직접 선택</option></select></div>
    <div><label>색 선택</label><input type="color" id="bgcolor" value="#2d7ff9"></div>
  </div>
  <div class="row" style="margin-top:14px"><button class="primary" id="go" disabled>배경 지우기</button></div>
  <div class="bar" id="bar" hidden><i id="barin"></i></div>
  <div class="msg" id="msg"></div>
</div>
<div class="card center" id="out" hidden>
  <div class="row" style="align-items:flex-start">
    <div><label>원본</label><img id="orig" class="preview"></div>
    <div><label>결과</label><div class="checker"><canvas id="res"></canvas></div></div>
  </div>
  <div class="row" style="justify-content:center;margin-top:14px"><button class="primary" id="dl">⬇ PNG 다운로드</button></div>
</div>
</main>
<script type="module">
const $=id=>document.getElementById(id);
let cutBlob=null,cutImg=null,srcName='image';
$('file').onchange=()=>{const f=$('file').files[0];$('go').disabled=!f;if(f){srcName=f.name.replace(/\.[^.]+$/,'');$('orig').src=URL.createObjectURL(f)}};
function paint(){
  if(!cutImg)return;
  const c=$('res'),x=c.getContext('2d');c.width=cutImg.naturalWidth;c.height=cutImg.naturalHeight;
  const m=$('bgmode').value;
  if(m!=='none'){x.fillStyle=m==='custom'?$('bgcolor').value:m;x.fillRect(0,0,c.width,c.height)}
  x.drawImage(cutImg,0,0);
}
$('bgmode').onchange=paint;$('bgcolor').oninput=()=>{$('bgmode').value='custom';paint()};
$('go').onclick=async()=>{
  const f=$('file').files[0];if(!f)return;
  $('go').disabled=true;$('msg').className='msg';$('msg').textContent='AI 모델 불러오는 중... (처음엔 오래 걸려요)';
  $('bar').hidden=false;$('barin').style.width='2%';
  try{
    const {removeBackground}=await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm');
    cutBlob=await removeBackground(f,{
      progress:(key,cur,total)=>{
        const p=total?Math.round(cur/total*100):0;
        $('barin').style.width=Math.max(2,p)+'%';
        $('msg').textContent=(key.startsWith('fetch')?'모델 내려받는 중 ':'처리 중 ')+p+'%';
      }
    });
    cutImg=new Image();
    cutImg.onload=()=>{paint();$('out').hidden=false;$('msg').className='msg ok';$('msg').textContent='완료!'};
    cutImg.src=URL.createObjectURL(cutBlob);
  }catch(e){
    $('msg').textContent='실패했어요: '+(e&&e.message?e.message:e)+' (인터넷 연결을 확인하거나 더 작은 사진으로 다시 시도해 보세요)';
  }
  $('bar').hidden=true;$('go').disabled=false;
};
$('dl').onclick=()=>{
  $('res').toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=srcName+'_배경제거.png';a.click()},'image/png');
};
</script></body></html>
