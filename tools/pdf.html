<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF 도구 · Kongbu</title><link rel="stylesheet" href="../style.css?v=4"><script src="../icons.js?v=4"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script></head>
<body>
<header class="top"><div class="in"><a class="brand" href="../"><span data-icon="logo"></span>Kongbu</a><a class="home" href="../"><span data-icon="back"></span>모든 도구</a></div></header>
<main>
<div class="ttl"><span class="tile" style="--c:#f43f5e" data-icon="pdf"></span><div><h1>PDF 도구</h1><p class="desc">이미지로 PDF 만들기, PDF 합치기, 페이지 나누기. 파일은 내 브라우저 밖으로 나가지 않아요.</p></div></div>

<div class="card">
  <h3 style="margin-top:0">이미지 → PDF</h3>
  <input type="file" id="imgs" accept="image/*" multiple>
  <div class="row" style="margin-top:10px"><button class="primary" id="b1">PDF 만들기</button></div>
</div>

<div class="card">
  <h3 style="margin-top:0">PDF 합치기</h3>
  <input type="file" id="merge" accept="application/pdf" multiple>
  <p class="note">선택한 순서대로 합쳐져요.</p>
  <div class="row"><button class="primary" id="b2">합치기</button></div>
</div>

<div class="card">
  <h3 style="margin-top:0">PDF 페이지 추출 / 나누기</h3>
  <input type="file" id="split" accept="application/pdf">
  <label>추출할 페이지 (예: 1-3,5,8)</label>
  <input id="range" placeholder="1-3,5">
  <div class="row" style="margin-top:10px"><button class="primary" id="b3">추출하기</button></div>
</div>
<div class="msg" id="msg"></div>
<div class="card" id="out" hidden></div>
</main>
<script>
const $=id=>document.getElementById(id);
const need=()=>{if(typeof PDFLib==='undefined'){$('msg').textContent='PDF 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.';return false}$('msg').textContent='';return true};
function result(bytes,name){
  const url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));
  $('out').hidden=false;
  $('out').innerHTML=`<div class="item" style="border:0"><span>${name} · ${(bytes.length/1024).toFixed(0)}KB</span><a class="btn primary" href="${url}" download="${name}">${I('download')} 다운로드</a></div>`;
}
const toPng=f=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=i.naturalWidth;c.height=i.naturalHeight;c.getContext('2d').drawImage(i,0,0);c.toBlob(b=>b.arrayBuffer().then(res),'image/png')};i.onerror=rej;i.src=URL.createObjectURL(f)});
$('b1').onclick=async()=>{
  if(!need())return;const fs=[...$('imgs').files];if(!fs.length){$('msg').textContent='이미지를 선택해 주세요.';return}
  try{
    const doc=await PDFLib.PDFDocument.create();
    for(const f of fs){
      let img;
      if(f.type==='image/jpeg')img=await doc.embedJpg(await f.arrayBuffer());
      else if(f.type==='image/png')img=await doc.embedPng(await f.arrayBuffer());
      else img=await doc.embedPng(await toPng(f));
      const p=doc.addPage([img.width,img.height]);p.drawImage(img,{x:0,y:0,width:img.width,height:img.height});
    }
    result(await doc.save(),'images.pdf');
  }catch(e){$('msg').textContent='실패: '+e.message}
};
$('b2').onclick=async()=>{
  if(!need())return;const fs=[...$('merge').files];if(fs.length<2){$('msg').textContent='PDF를 2개 이상 선택해 주세요.';return}
  try{
    const out=await PDFLib.PDFDocument.create();
    for(const f of fs){const d=await PDFLib.PDFDocument.load(await f.arrayBuffer());(await out.copyPages(d,d.getPageIndices())).forEach(p=>out.addPage(p))}
    result(await out.save(),'merged.pdf');
  }catch(e){$('msg').textContent='실패: '+e.message}
};
$('b3').onclick=async()=>{
  if(!need())return;const f=$('split').files[0];if(!f){$('msg').textContent='PDF를 선택해 주세요.';return}
  try{
    const src=await PDFLib.PDFDocument.load(await f.arrayBuffer()),n=src.getPageCount(),idx=[];
    for(const part of $('range').value.split(',')){
      const m=part.trim().match(/^(\d+)(?:-(\d+))?$/);if(!m)continue;
      const a=+m[1],b=+(m[2]||m[1]);for(let i=Math.min(a,b);i<=Math.max(a,b);i++)if(i>=1&&i<=n)idx.push(i-1);
    }
    if(!idx.length){$('msg').textContent=`페이지 범위를 확인해 주세요. (전체 ${n}쪽)`;return}
    const out=await PDFLib.PDFDocument.create();(await out.copyPages(src,idx)).forEach(p=>out.addPage(p));
    result(await out.save(),f.name.replace(/\.pdf$/i,'')+'_추출.pdf');
  }catch(e){$('msg').textContent='실패: '+e.message}
};
</script></body></html>
